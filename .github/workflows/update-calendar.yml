name: Update Real Madrid calendar

on:
  schedule:
    # Lunes 14:00 UTC = 08:00 en Ciudad de México (UTC-6, sin horario de verano).
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update calendar
        run: python scripts/update_calendar.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- real-madrid.ics; then
            echo "Sin cambios en real-madrid.ics; no se crea commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real-madrid.ics
          git commit -m "chore: update Real Madrid calendar"
          git push
